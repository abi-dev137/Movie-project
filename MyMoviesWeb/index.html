<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movies Watchlist</title>
    <link rel="stylesheet" href="movies.css">
</head>


<body>

<!-- Auth Overlay / Card (Shown when NOT logged in) -->
<div id="auth-container" class="auth-card">
  <h2 id="auth-title">Welcome to Movie Watchlist</h2>
  <p id="auth-subtitle">Sign in to access your personal movie library</p>

  <form id="auth-form">
    <div class="input-group">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="name@example.com" required autocomplete="email" />
    </div>

    <div class="input-group">
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" placeholder="At least 6 characters" required autocomplete="current-password" />
    </div>

    <p id="auth-error" class="auth-error-msg" style="display: none;"></p>

    <button type="submit" id="auth-submit-btn" class="primary-btn">Sign In</button>
  </form>

  <div class="auth-toggle">
    <span id="auth-toggle-text">Don't have an account?</span>
    <button type="button" id="auth-toggle-btn">Create one</button>
  </div>
</div>

<!-- Logged In Status Bar (Shown when logged in) -->
<header id="user-header" class="user-header" style="display: none;">
  <span id="user-display-email" class="user-email-badge"></span>
  <button id="logout-btn" class="secondary-btn">Sign Out</button>
</header>

<!-- Main App Content (Hidden until logged in) -->
<main id="app-content" style="display: none;">
  <!-- Your existing movie form, search bars, filters, and movie list container stay here -->
</main>

    <div class="wrap"><!-- this class called wrap is where everything on the page will live inside, it is there to help center the whole page-->

  <header>
    <h1>My Movies Watchlist</h1><!--the whole page title-->
    <h3>Movies I will want to watch</h3>
    <span id="countLabel">0 movies</span><!--this counter counts the number of movies added-->
  </header>

  <!-- This form is for for adding a movies and its details   -->
  <div class="panel">
    <h2>Add a movie</h2>
    <div class="form-grid">
      <input type="text" id="inputTitle" placeholder="Title">
      <input type="number" id="inputYear" placeholder="Year">
      <!-- list="genreList" connects this box to the suggestions below; you can still type any other genre -->
<input type="text" id="inputGenre" list="genreList" placeholder="Genre / tag">
<!-- the dropdown suggestions: add or remove options here anytime -->
<datalist id="genreList">
  <option value="Drama">
  <option value="Action">
  <option value="Comedy">
  <option value="Fantasy">
  <option value="Animation">
  <option value="Anime">
  <option value="Romance">
    <option value="Family">
</datalist>
    </div>
    <div class="form-grid full-row">
      <input type="text" id="inputPoster" placeholder="Poster image URL (optional)">
      <!-- list="countryList" connects this box to the suggestions below; you can still type any other country -->
      <input type="text" id="inputCountry" list="countryList" placeholder="Country">
      <!-- the dropdown suggestions: add or remove options here anytime -->
      <datalist id="countryList">
        <option value="United Kingdom">
        <option value="United States">
        <option value="China">
        <option value="South Korea">
        <option value="Canada">
      </datalist>
    </div>
    
    <div class="form-grid full-row">
      <textarea id="inputDescription" placeholder="Short note — helps tell apart similar titles or remakes (optional)" rows="2"></textarea>
    </div>

    <button class="btn-add" id="addBtn">Add to watchlist</button>
    <button class="btn-cancel" id="cancelEditBtn" style="display:none;">Cancel edit</button>
  </div>

  <!-- TOOLBAR: for searhing movies in the list-->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by title, year, genre, or country...">
    <select id="sortSelect">
      <option value="earliest">Earliest added</option>
      <option value="latest">Latest added</option>
      <option value="az">Title (A–Z)</option>
      <option value="year">Release year</option>
    </select>
    
    <select id="viewSelect">
  <option value="list">List view</option>
  <option value="grid">Grid view</option>
</select>
  </div>

  <!-- MOVIE CARDS get inserted here by JavaScript -->
  <div class="movie-list" id="movieList"></div>

</div>

<script type="module" src="movies.js"></script>
</body>

</html>
